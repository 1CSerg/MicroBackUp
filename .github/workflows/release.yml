name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-build.txt

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Build executables
        run: python build.py

      - name: Rename Linux binary (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mv dist/MicroBackUp dist/MicroBackUp-linux

      - name: Upload Linux artifact (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/MicroBackUp-linux

      - name: Pack Python distribution (Windows only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $dir = "MicroBackUp-$tag-python"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item -Path @(
            "main.py",
            "backup.py",
            "README.md",
            "MicroBackUp.conf.example",
            "requirements.txt",
            "LICENSE"
          ) -Destination $dir
          Compress-Archive -Path $dir -DestinationPath "dist/$dir.zip" -Force

      - name: Upload Windows artifacts (Windows only)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/MicroBackUp.exe
            dist/MicroBackUp-bg.exe
            dist/MicroBackUp-*-python.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/MicroBackUp.exe
            dist/MicroBackUp-bg.exe
            dist/MicroBackUp-linux
            dist/MicroBackUp-*-python.zip
